<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mert Akay — Yönetmen</title>
<meta name="description" content="Mert Akay — Yönetmen. Reklam, müzik videosu ve kısa film.">
<meta property="og:title" content="Mert Akay — Yönetmen">
<meta property="og:description" content="Reklam, müzik videosu ve kısa film.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mertakay.com">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --serif:'Instrument Serif',Georgia,serif; --sans:'Instrument Sans',-apple-system,system-ui,sans-serif; --ease:cubic-bezier(.22,.61,.36,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:#000; }
  html.ready { scroll-snap-type:y mandatory; }
  body { color:#fff; font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }

  /* sabit üst yazılar */
  .top { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between; align-items:center;
         padding:24px 4vw; mix-blend-mode:difference; pointer-events:none; }
  .top a { pointer-events:auto; }
  .logo { font-weight:700; font-size:15px; letter-spacing:.04em; text-transform:uppercase; }
  .top nav a { font-family:var(--serif); font-style:italic; font-size:22px; border-bottom:1px solid currentColor; }

  /* tam ekran video bölümleri */
  .film { position:relative; height:100vh; height:100svh; overflow:hidden; scroll-snap-align:start; scroll-snap-stop:always; cursor:pointer; background:#000; }
  .film video, .film img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .film img { transition:opacity 1s var(--ease); }
  .film::after { content:''; position:absolute; left:0; right:0; bottom:0; height:40%; pointer-events:none;
                 background:linear-gradient(transparent, rgba(0,0,0,.45)); }
  .label { position:absolute; left:4vw; bottom:4.5vh; z-index:2; }
  .label .n { font-family:var(--sans); font-size:12px; letter-spacing:.12em; opacity:.75; }
  .label h2 { font-family:var(--serif); font-weight:400; font-size:clamp(30px,4vw,60px); line-height:1; margin-top:8px; }
  .label .i { font-size:14px; opacity:.8; margin-top:8px; }
  .watch { position:absolute; right:4vw; bottom:4.5vh; z-index:2; font-family:var(--serif); font-style:italic; font-size:22px;
           border-bottom:1px solid currentColor; opacity:.85; transition:opacity .3s; }
  .film:hover .watch { opacity:1; }

  /* iletişim (son ekran) */
  .contact { height:100vh; height:100svh; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:center; align-items:center;
             text-align:center; padding:0 6vw; background:#000; }
  .contact .lbl { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  .contact h2 { font-family:var(--serif); font-weight:400; font-size:clamp(46px,7.5vw,112px); line-height:.98; margin-top:3vh; }
  .contact .mail { margin-top:5vh; font-family:var(--serif); font-size:clamp(24px,2.6vw,38px); border-bottom:1px solid #fff; }
  .contact .mail:hover { font-style:italic; }
  .contact .social { margin-top:3vh; font-size:14px; opacity:.6; }
  .contact .social a { margin:0 10px; }
  .contact footer { position:absolute; bottom:24px; font-size:12px; opacity:.4; }

  /* oynatıcı (sesli izleme) */
  #player { position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center;
            opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility 0s .4s; }
  #player.open { opacity:1; visibility:visible; transition:opacity .4s var(--ease); }
  #player .frame { width:min(100vw, 177.78vh); aspect-ratio:16/9; }
  #player iframe, #player video { width:100%; height:100%; border:0; display:block; background:#000; }
  #player .frame.file iframe, #player .frame:not(.file) video { display:none; }
  #close { position:absolute; top:22px; right:4vw; z-index:2; background:none; border:0; cursor:pointer; color:#fff;
           font-family:var(--serif); font-style:italic; font-size:22px; border-bottom:1px solid currentColor; }

  @media (max-width:760px) {
    .top { padding:18px 5vw; }
    .label { left:5vw; bottom:5vh; }
    .watch { right:5vw; bottom:5vh; font-size:18px; }
  }
</style>
</head>
<body>

<div class="top">
  <a href="#" class="logo">Mert Akay</a>
  <nav><a href="#iletisim">İletişim</a></nav>
</div>

<main id="films"></main>

<section class="contact" id="iletisim" style="position:relative">
  <div class="lbl">İletişim</div>
  <h2>Birlikte bir şey <em>yapalım</em></h2>
  <a class="mail" href="mailto:info@mertakay.com">info@mertakay.com</a>
  <div class="social">
    <a href="https://vimeo.com/" target="_blank" rel="noopener">Vimeo</a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
  </div>
  <footer>© <span id="yil"></span> Mert Akay — İstanbul</footer>
</section>

<div id="player" role="dialog" aria-modal="true" aria-label="Video oynatıcı">
  <button id="close" aria-label="Kapat">Kapat</button>
  <div class="frame"><iframe id="pf" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe><video id="pv" controls playsinline></video></div>
</div>

<script>
/* ====================================================================
   VİDEOLAR — sırayla tam ekran gösterilir.
   Kendi dosyanız (ekranda kendiliğinden oynar):
     videolar klasörüne isim.mp4 ve isim.jpg (kapak) yükleyip
     { file: "videolar/isim", title: "...", info: "..." }
   Vimeo videosu (ekranda kapak görseli, tıklayınca oynar):
     { vimeo: "123456789", title: "...", info: "..." }
   ==================================================================== */
const VIDEOS = [
  { vimeo: "1070333005", title: "Ayakkabı Dünyası", info: "Özge Özacar · Provoq" },
  { vimeo: "482504420",  title: "AVVA FW21",        info: "Murat Boz" },
  { vimeo: "1070313913", title: "ELLE x Ford",      info: "Virtualalin" },
];

function vimeoThumb(id, img) {
  fetch('https://vimeo.com/api/oembed.json?width=1920&url=' + encodeURIComponent('https://vimeo.com/' + id))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.thumbnail_url) img.src = d.thumbnail_url.replace(/_\d+x\d+/, '_1920'); })
    .catch(function () {});
}

var films = document.getElementById('films');
var bgVideos = [];
VIDEOS.forEach(function (v, i) {
  var s = document.createElement('section');
  s.className = 'film'; s.tabIndex = 0;
  s.setAttribute('aria-label', v.title + ' izle');
  if (v.file) {
    var vid = document.createElement('video');
    vid.muted = true; vid.loop = true; vid.playsInline = true; vid.setAttribute('playsinline', '');
    vid.preload = i === 0 ? 'auto' : 'none';
    vid.poster = v.file + '.jpg';
    vid.src = v.file + '.mp4';
    s.appendChild(vid); bgVideos.push(vid);
  } else {
    var img = document.createElement('img'); img.alt = '';
    vimeoThumb(v.vimeo.split('/')[0], img);
    s.appendChild(img);
  }
  var label = document.createElement('div'); label.className = 'label';
  label.innerHTML = '<div class="n"></div><h2></h2><div class="i"></div>';
  label.querySelector('.n').textContent = String(i + 1).padStart(2, '0') + ' / ' + String(VIDEOS.length).padStart(2, '0');
  label.querySelector('h2').textContent = v.title;
  label.querySelector('.i').textContent = v.info || '';
  s.appendChild(label);
  var w = document.createElement('span'); w.className = 'watch'; w.textContent = 'İzle';
  s.appendChild(w);
  s.onclick = function () { openPlayer(v); };
  s.onkeydown = function (e) { if (e.key === 'Enter') openPlayer(v); };
  films.appendChild(s);
});

/* arka plan videoları sadece ekrandayken oynasın */
var io = new IntersectionObserver(function (es) {
  es.forEach(function (e) {
    var vid = e.target;
    if (e.isIntersecting) { vid.preload = 'auto'; var p = vid.play(); if (p && p.catch) p.catch(function () {}); }
    else vid.pause();
  });
}, { threshold: .35 });
bgVideos.forEach(function (vid) { io.observe(vid); });

/* kaydırma tutunmasını videolar yerleştikten sonra aç */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.scrollTo(0, 0);
document.documentElement.classList.add('ready');

/* sesli oynatıcı */
var player = document.getElementById('player'), pf = document.getElementById('pf'), pv = document.getElementById('pv');
var frame = player.querySelector('.frame');
function openPlayer(v) {
  bgVideos.forEach(function (b) { b.pause(); });
  if (v.file) {
    frame.classList.add('file');
    pv.poster = v.file + '.jpg'; pv.src = v.file + '.mp4';
    var p = pv.play(); if (p && p.catch) p.catch(function () {});
  } else {
    frame.classList.remove('file');
    var parts = v.vimeo.split('/');
    pf.src = 'https://player.vimeo.com/video/' + parts[0] + '?autoplay=1&title=0&byline=0&portrait=0&dnt=1' + (parts[1] ? '&h=' + parts[1] : '');
  }
  player.classList.add('open'); document.body.style.overflow = 'hidden';
}
function closePlayer() {
  player.classList.remove('open'); document.body.style.overflow = '';
  pv.pause();
  setTimeout(function () { if (!player.classList.contains('open')) { pf.src = ''; pv.removeAttribute('src'); pv.load(); } }, 400);
  bgVideos.forEach(function (b) { var r = b.getBoundingClientRect(); if (r.top < innerHeight * .6 && r.bottom > innerHeight * .4) { var p = b.play(); if (p && p.catch) p.catch(function () {}); } });
}
document.getElementById('close').onclick = closePlayer;
addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayer(); });
document.getElementById('yil').textContent = new Date().getFullYear();
</script>
</body>
</html>
