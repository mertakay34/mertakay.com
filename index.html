<style>
  :root { --accent:#A855F7; --mono:'DM Mono','IBM Plex Mono',ui-monospace,Menlo,monospace; --fs:clamp(9px,.78125vw,16px); --ease:cubic-bezier(.22,.61,.36,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; color:var(--accent); }
  body { font-family:var(--mono); font-size:var(--fs); font-weight:500; letter-spacing:.03em; text-transform:uppercase; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-transform:inherit; }

  /* üst menü */
  header { position:fixed; top:24px; left:0; width:100%; z-index:100; user-select:none;
           opacity:0; }
  body.ready header { opacity:1; }
  header nav { display:flex; justify-content:space-between; padding:0 16px; }
  header nav a { text-shadow:0 0 8px rgba(0,0,0,.7); }

  /* açılış: sade, ortada MERT AKAY */
  .hero { height:100vh; height:100svh; display:flex; align-items:center; justify-content:center; }
  .wordmark { font-family:'Archivo Black',var(--mono); font-weight:400; font-size:clamp(20px,2.6vw,46px); line-height:1; letter-spacing:-.01em; text-transform:uppercase; }

  /* filtreler */
  .filters { padding:calc(24px + 3.2em) 16px 0; display:flex; flex-direction:column; align-items:flex-start; gap:2px; line-height:1.5; }
  .filters button { opacity:.4; transition:opacity .3s; text-align:left; }
  .filters button:hover, .filters button.active { opacity:1; }

  /* ızgara */
  .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px 16px; padding:10vh 16px 0; }
  .item { position:relative; cursor:pointer; opacity:0; transform:translateY(14px); transition:opacity .7s var(--ease), transform .7s var(--ease); }
  .item.visible { opacity:1; transform:none; }
  .item.hidden { display:none; }
  .item h2 { font-weight:400; font-size:var(--fs); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item h2 .num { margin-right:18px; }
  .media { position:relative; padding-bottom:62.6%; background:#161616; overflow:hidden; }
  .media img, .media video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .media video { opacity:0; transition:opacity .49s; }
  .item:hover .media video.ready { opacity:1; }
  .media img { transition:opacity .49s, filter .49s; }
  .item:hover .media img.vimeo { filter:brightness(1.12); }
  .media iframe { position:absolute; top:50%; left:50%; width:100%; height:100%; transform:translate(-50%,-50%); border:0; pointer-events:none; opacity:0; transition:opacity .6s var(--ease); }
  .media iframe.on { opacity:1; }
  .item.big { grid-column:span 2; grid-row:span 2; }
  .item.big .media { padding-bottom:0; height:calc(100% - var(--fs) * 1.3 - 10px); min-height:30vw; }

  /* alt bilgi */
  .langs { display:flex; flex-wrap:wrap; gap:6px 18px; padding:16vh 16px 0; }
  .langs button { opacity:.4; transition:opacity .3s; }
  .langs button:hover, .langs button.active { opacity:1; }
  .foot { display:flex; justify-content:space-between; padding:4vh 16px 24px; opacity:.4; }
  .foot a:hover { opacity:1; }

  /* bilgi paneli */
  #info { position:fixed; inset:0; z-index:90; background:#000; padding:calc(24px + 5em) 16px 24px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
          opacity:0; visibility:hidden; transition:opacity .5s var(--ease), visibility 0s .5s; overflow:auto; align-content:start; }
  #info.open { opacity:1; visibility:visible; transition:opacity .5s var(--ease); }
  #info .bio { grid-column:2 / span 2; line-height:1.6; }
  #info .bio p + p { margin-top:1.6em; }
  #info .contact { line-height:1.8; }
  #info .contact span { opacity:.4; display:block; }
  #info a:hover { opacity:.6; }

  /* oynatıcı */
  #player { position:fixed; inset:0; z-index:150; background:#000; display:flex; align-items:center; justify-content:center;
            opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility 0s .4s; }
  #player.open { opacity:1; visibility:visible; transition:opacity .4s var(--ease); }
  #player .frame { width:min(100vw - 32px, (100vh - 120px) * 1.7778); aspect-ratio:16/9; }
  #player iframe, #player video { width:100%; height:100%; border:0; display:block; background:#000; }
  #player .frame.file iframe, #player .frame:not(.file) video { display:none; }
  #player .bar { position:absolute; top:24px; left:16px; right:16px; display:flex; justify-content:space-between; }

  @media (max-width:767px) {
    :root { --fs:9px; }
    header nav a:first-child { order:3; } header nav a:last-child { order:2; }
    .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 8px; padding-top:5vh; }
    .item h2 { margin-bottom:4px; }
    .item h2 .num { margin-right:6px; }
    .item.big .media { height:auto; min-height:0; padding-bottom:62.6%; }
    #info { grid-template-columns:1fr; }
    #info .bio { grid-column:auto; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .item { opacity:1; transform:none; }
  }
</style>

<main>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
/* ====================================================================

   Türkçe olup bu harfleri içermeyen kelimeleri TR_WORDS listesine ekleyin.
   Vimeo videosu:   { vimeo: "123456789", title: "Marka 'Proje'" }
   (Gizli Vimeo videolarında kapak otomatik gelmez; thumb: "görsel linki" ekleyin.)
   Kendi dosyanız:  videolar klasörüne isim.mp4 ve isim.jpg yükleyip

const FILTERS = [
  { id: "all",       label: "Tüm Projeler" },
  { id: "secili",    label: "Seçilmiş İşler" },
  { id: "reklam",    label: "Reklam" },
  { id: "muzik",     label: "Müzik Videoları" },
  { id: "kisa-film", label: "Kısa Film" },
];

var TR_WORDS = ['ali', 'demir', 'giyinme'];
function setTitle(el, title) {
  el.textContent = '';
  title.split(/(\s+)/).forEach(function (w) {
    if (!w.trim()) { el.appendChild(document.createTextNode(w)); return; }
    var sp = document.createElement('span');
    var clean = w.replace(/[^\wçğıöşüÇĞİÖŞÜ]/g, '').toLocaleLowerCase('tr');
    sp.lang = (/[çğıöşüÇĞİÖŞÜ]/.test(w) || TR_WORDS.indexOf(clean) > -1) ? 'tr' : 'en';
    sp.textContent = w; el.appendChild(sp);
  });
}
function vimeoThumb(id, img, w, v) {
  fetch('https://vimeo.com/api/oembed.json?width=' + w + '&url=' + encodeURIComponent('https://vimeo.com/' + id))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.width && d.height) { v.ratio = d.width / d.height; fitAll(); }
      if (d.thumbnail_url && !v.thumb) img.src = d.thumbnail_url.replace(/_\d+(x\d+)?(?=[?.]|$)/, '_' + w);
    })
    .catch(function () {});
}

/* kutu içi oynatma: video kutuyu tamamen kaplasın (kenarlarda siyah bant olmasın) */
function fit(it) {
  var f = it.frame; if (!f) return;
  var box = it.media, bw = box.clientWidth, bh = box.clientHeight, r = it.v.ratio || 16 / 9;
  if (bw / bh > r) { f.style.width = bw + 'px'; f.style.height = Math.ceil(bw / r) + 'px'; }
  else { f.style.height = bh + 'px'; f.style.width = Math.ceil(bh * r) + 'px'; }
}
function fitAll() { if (window.items) items.forEach(fit); }
addEventListener('resize', fitAll);

function startInline(it) {
  if (it.frame || !it.v.vimeo) return;
  var parts = it.v.vimeo.split('/');
  var f = document.createElement('iframe');
  f.allow = 'autoplay; fullscreen; picture-in-picture';
  f.setAttribute('tabindex', '-1');
  f.src = 'https://player.vimeo.com/video/' + parts[0] + '?background=1&autoplay=1&muted=1&loop=1&autopause=0&dnt=1&quality=540p' + (parts[1] ? '&h=' + parts[1] : '');
  it.media.appendChild(f); it.frame = f; fit(it);
  try {
    var pl = new Vimeo.Player(f);
    pl.on('play', function () { f.classList.add('on'); });
    pl.on('timeupdate', function () { f.classList.add('on'); });
  } catch (e) { setTimeout(function () { f.classList.add('on'); }, 1500); }
}
function stopInline(it) {
  if (!it.frame) return;
  it.frame.remove(); it.frame = null;
}
function inFilter(v, f) {
  if (f === 'all') return true;
  if (f === 'secili') return !!v.secili;
  return (',' + (v.kategori || '') + ',').indexOf(',' + f + ',') > -1;
}

/* ızgara */
var grid = document.getElementById('grid');
var items = VIDEOS.map(function (v, i) {
  var a = document.createElement('article');
  a.className = 'item'; a.tabIndex = 0;
  a.innerHTML = '<h2><span class="num"></span><span class="t"></span></h2><div class="media"><img alt="" loading="lazy"></div>';
  setTitle(a.querySelector('.t'), v.title);
  a.setAttribute('aria-label', v.title);
  var media = a.querySelector('.media'), img = a.querySelector('img');
  if (v.file) {
    img.src = v.file + '.jpg';
    var pv = document.createElement('video');
    pv.muted = true; pv.loop = true; pv.playsInline = true; pv.preload = 'none';
    pv.src = v.file + '.mp4';
    pv.addEventListener('playing', function () { pv.classList.add('ready'); });
    media.appendChild(pv);
    a.addEventListener('mouseenter', function () { var p = pv.play(); if (p && p.catch) p.catch(function () {}); });
    a.addEventListener('mouseleave', function () { pv.pause(); });
  } else {
    img.className = 'vimeo';
    if (v.thumb) img.src = v.thumb;
    vimeoThumb(v.vimeo.split('/')[0], img, i === 0 ? 1280 : 640, v);
  }
  a.onclick = function () { openPlayer(v); };
  a.onkeydown = function (e) { if (e.key === 'Enter') openPlayer(v); };
  grid.appendChild(a);
  return { el: a, v: v, media: media, frame: null };
});
window.items = items;

/* ekrana giren kutular oynar, çıkanlar durur (site hızlı kalsın) */
var playIO = new IntersectionObserver(function (es) {
  es.forEach(function (e) {
    var it = items[+e.target.dataset.i];
    if (e.isIntersecting) startInline(it); else stopInline(it);
  });
}, { rootMargin: '0px' });
items.forEach(function (it, i) { it.el.dataset.i = i; playIO.observe(it.el); });

/* projeler (hepsi gösterilir) */
function applyFilter(f) {
  var n = 0;
  items.forEach(function (it) {
    var show = inFilter(it.v, f);
    it.el.classList.toggle('hidden', !show);
    it.el.classList.remove('big', 'visible');
    if (show) {
      n++;
      it.el.querySelector('.num').textContent = String(n).padStart(2, '0');
      setTimeout(function () { it.el.classList.add('visible'); }, 60 * n);
    }
  });
}
applyFilter('all');
fitAll();

/* menü */
var info = document.getElementById('info');
function setInfo(open) { info.classList.toggle('open', open); info.setAttribute('aria-hidden', !open); }
document.querySelectorAll('[data-act]').forEach(function (a) {
  a.onclick = function (e) {
    e.preventDefault();
    var act = a.dataset.act;
    if (act === 'info') { setInfo(!info.classList.contains('open')); return; }
    setInfo(false);
    if (act === 'archive') applyFilter('all');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});

/* oynatıcı */
var player = document.getElementById('player'), pf = document.getElementById('pf'), pvid = document.getElementById('pv');
var frame = player.querySelector('.frame');
function openPlayer(v) {
  setTitle(document.getElementById('ptitle'), v.title);
  if (v.file) {
    frame.classList.add('file');
    pvid.poster = v.file + '.jpg'; pvid.src = v.file + '.mp4';
    var p = pvid.play(); if (p && p.catch) p.catch(function () {});
  } else {
    frame.classList.remove('file');
    var parts = v.vimeo.split('/');
    pf.src = 'https://player.vimeo.com/video/' + parts[0] + '?autoplay=1&title=0&byline=0&portrait=0&badge=0&vimeo_logo=0&share=0&like=0&watch_later=0&collections=0&dnt=1&quality=auto' + (parts[1] ? '&h=' + parts[1] : '');
  }
  player.classList.add('open'); document.body.style.overflow = 'hidden';
}
function closePlayer() {
  player.classList.remove('open'); document.body.style.overflow = '';
  pvid.pause();
  setTimeout(function () { if (!player.classList.contains('open')) { pf.src = ''; pvid.removeAttribute('src'); pvid.load(); } }, 400);
}
document.getElementById('close').onclick = closePlayer;
addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePlayer(); setInfo(false); } });

/* diller — İngilizce ana dil, Türkçe ikinci */
var LANGS = [

  ['de', 'Deutsch',    ['Archiv', 'Info', 'Projekte', 'Kontakt', 'Nach oben', 'Schließen', 'Mert Akay ist ein in Istanbul ansässiger Regisseur.', 'Er arbeitet mit Marken und Künstlern an Werbefilmen, Musikvideos und Kurzfilmen.']],
  ['fr', 'Français',   ['Archives', 'Infos', 'Projets', 'Contact', 'Haut de page', 'Fermer', 'Mert Akay est un réalisateur basé à Istanbul.', 'Il travaille avec des marques et des artistes sur des publicités, des clips et des courts métrages.']],
  ['es', 'Español',    ['Archivo', 'Info', 'Proyectos', 'Contacto', 'Volver arriba', 'Cerrar', 'Mert Akay es un director afincado en Estambul.', 'Trabaja con marcas y artistas en publicidad, videoclips y cortometrajes.']],
  ['it', 'Italiano',   ['Archivio', 'Info', 'Progetti', 'Contatti', 'Torna su', 'Chiudi', 'Mert Akay è un regista con base a Istanbul.', 'Lavora con marchi e artisti tra pubblicità, videoclip e cortometraggi.']],

  ['zh', '中文',        ['档案', '信息', '作品', '联系', '返回顶部', '关闭', 'Mert Akay 是一位常驻伊斯坦布尔的导演。', '他与品牌和艺术家合作，创作广告、音乐录影带和短片。']],
  ['ja', '日本語',      ['アーカイブ', '情報', 'プロジェクト', '連絡先', 'トップへ', '閉じる', 'Mert Akay はイスタンブールを拠点とする映像監督です。', '広告、ミュージックビデオ、短編映画の分野でブランドやアーティストと仕事をしています。']],
  ['ko', '한국어',      ['아카이브', '정보', '프로젝트', '연락처', '맨 위로', '닫기', 'Mert Akay는 이스탄불을 기반으로 활동하는 감독입니다.', '광고, 뮤직비디오, 단편영화 분야에서 브랜드 및 아티스트와 작업합니다.']]
];
var KEYS = ['archive', 'info', 'projects', 'contact', 'top', 'close', 'bio1', 'bio2'];
var langsEl = document.getElementById('langs');
function setLang(code) {
  var L = LANGS.filter(function (l) { return l[0] === code; })[0] || LANGS[0];
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var k = KEYS.indexOf(el.dataset.i18n); if (k > -1) { el.textContent = L[2][k]; el.lang = L[0]; }
  });
  document.getElementById('info').lang = L[0];
  document.documentElement.lang = L[0];
  langsEl.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.l === L[0]); });
  try { localStorage.setItem('lang', L[0]); } catch (e) {}
}
LANGS.forEach(function (l) {
  var b = document.createElement('button');
  b.textContent = l[1]; b.lang = l[0]; b.dataset.l = l[0];
  b.onclick = function () { setLang(l[0]); };
  langsEl.appendChild(b);
});
var saved = 'en';
try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
setLang(saved);

/* açılış */
document.getElementById('yil').textContent = new Date().getFullYear();
document.body.classList.add('ready');
</script>
