<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mert Akay — Yönetmen</title>
<meta name="description" content="Mert Akay — Yönetmen. Seçilmiş işler.">
<meta property="og:title" content="Mert Akay — Yönetmen">
<meta property="og:description" content="Seçilmiş işler">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mertakay.com">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --ink:#ededed; --muted:#7a7a7a; --line:#1f1f1f; --ease:cubic-bezier(.22,.61,.36,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--bg); scroll-behavior:smooth; }
  body { color:var(--ink); font-family:'Inter',-apple-system,system-ui,sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  img { display:block; }

  header { position:fixed; inset:0 0 auto; z-index:20; display:flex; justify-content:space-between; align-items:center;
           padding:26px 5vw; transition:background .4s var(--ease); }
  header.solid { background:rgba(0,0,0,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .logo { font-size:14px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; }
  nav a { font-size:13px; color:var(--muted); margin-left:28px; transition:color .2s; }
  nav a:hover { color:var(--ink); }

  /* açılış */
  .hero { position:relative; height:100vh; overflow:hidden; cursor:pointer; background:#0b0b0b; }
  .hero img { width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.6s var(--ease); }
  .hero img.loaded { opacity:.75; }
  .hero-text { position:absolute; left:5vw; bottom:9vh; }
  .hero-text h1 { font-size:clamp(34px,5vw,64px); font-weight:400; letter-spacing:-.02em; line-height:1.05; }
  .hero-text p { margin-top:10px; font-size:15px; color:#bdbdbd; }
  .hero-text .watch { display:inline-block; margin-top:22px; font-size:13px; letter-spacing:.12em; text-transform:uppercase;
                      border-bottom:1px solid rgba(255,255,255,.4); padding-bottom:4px; }
  .fade-in { opacity:0; animation:fade 1.4s var(--ease) .3s forwards; }
  @keyframes fade { to { opacity:1; } }

  /* işler */
  .works { padding:14vh 5vw 6vh; }
  .works h2, .about h2 { font-size:13px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:6vh; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7vh 3vw; }
  .work { cursor:pointer; }
  .thumb { position:relative; aspect-ratio:16/9; overflow:hidden; background:#111; }
  .thumb img { width:100%; height:100%; object-fit:cover; opacity:.9; transition:opacity .5s var(--ease), transform 1.2s var(--ease); }
  .work:hover .thumb img { opacity:1; transform:scale(1.02); }
  .meta { display:flex; justify-content:space-between; gap:16px; padding-top:14px; }
  .meta .t { font-size:15px; font-weight:400; }
  .meta .i { font-size:13px; color:var(--muted); white-space:nowrap; }

  /* hakkında / iletişim */
  .about { border-top:1px solid var(--line); margin:8vh 5vw 0; padding:12vh 0; display:grid; grid-template-columns:1fr 2fr; gap:5vw; }
  .about h2 { margin-bottom:0; }
  .about p { font-size:clamp(18px,1.8vw,23px); line-height:1.6; color:#cfcfcf; max-width:36em; }
  .contact { margin-top:5vh; font-size:15px; line-height:2.1; }
  .contact a { border-bottom:1px solid #333; transition:border-color .2s; }
  .contact a:hover { border-color:var(--ink); }
  .contact .sep { color:#444; margin:0 10px; }

  footer { padding:26px 5vw; font-size:12px; color:#555; display:flex; justify-content:space-between; }

  /* görünüme girince */
  .reveal { opacity:0; transform:translateY(24px); transition:opacity 1s var(--ease), transform 1s var(--ease); }
  .reveal.in { opacity:1; transform:none; }

  /* oynatıcı */
  #player { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.96); display:flex; align-items:center; justify-content:center; padding:5vw;
            opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility 0s .4s; }
  #player.open { opacity:1; visibility:visible; transition:opacity .4s var(--ease); }
  #player .frame { width:min(1400px,100%,(100vh - 10vw) * 1.7778); aspect-ratio:16/9; background:#000; }
  #player iframe { width:100%; height:100%; border:0; display:block; }
  #close { position:absolute; top:24px; right:5vw; background:none; border:0; color:var(--ink); font:inherit; font-size:13px;
           letter-spacing:.14em; text-transform:uppercase; cursor:pointer; opacity:.7; }
  #close:hover { opacity:1; }

  @media (max-width:760px) {
    header { padding:20px 6vw; }
    nav a { margin-left:18px; }
    .grid { grid-template-columns:1fr; gap:6vh; }
    .about { grid-template-columns:1fr; gap:4vh; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .fade-in, .reveal { opacity:1; transform:none; }
  }
</style>
</head>
<body>

<header id="hdr">
  <a href="#" class="logo">Mert Akay</a>
  <nav><a href="#isler">İşler</a><a href="#hakkinda">Hakkında</a></nav>
</header>

<section class="hero" id="hero" role="button" tabindex="0">
  <img id="heroImg" alt="">
  <div class="hero-text fade-in">
    <h1>Mert Akay</h1>
    <p>Yönetmen</p>
    <span class="watch" id="heroWatch">İzle</span>
  </div>
</section>

<section class="works" id="isler">
  <h2 class="reveal">Seçilmiş İşler</h2>
  <div class="grid" id="grid"></div>
</section>

<section class="about" id="hakkinda">
  <h2 class="reveal">Hakkında</h2>
  <div class="reveal">
    <p>Mert Akay, İstanbul merkezli bir yönetmen. Reklam, müzik videosu ve kısa film alanında markalar ve sanatçılarla çalışıyor.</p>
    <div class="contact">
      <a href="mailto:info@mertakay.com">info@mertakay.com</a><br>
      <a href="https://vimeo.com/" target="_blank" rel="noopener">Vimeo</a><span class="sep">/</span><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</section>

<footer><span>© <span id="yil"></span> Mert Akay</span><span>mertakay.com</span></footer>

<div id="player" role="dialog" aria-modal="true" aria-label="Video oynatıcı">
  <button id="close" aria-label="Kapat">Kapat ✕</button>
  <div class="frame"><iframe id="pf" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
</div>

<script>
/* ====================================================================
   VİDEOLAR — yeni video eklemek için bu listeye bir satır ekleyin.
   vimeo: Vimeo linkindeki numara (vimeo.com/123456789 → "123456789")
   Gizli ("unlisted") videolarda ikinci parçayı da ekleyin:
   vimeo.com/123456789/abcdef1234 → "123456789/abcdef1234"
   İlk video açılışta tam ekran gösterilir.
   ==================================================================== */
const VIDEOS = [
  { vimeo: "76979871", title: "Proje Adı 1", info: "Marka · 2026" },
  { vimeo: "22439234", title: "Proje Adı 2", info: "Müzik Videosu · 2025" },
  { vimeo: "1084537",  title: "Proje Adı 3", info: "Kısa Film · 2025" },
];

function thumb(v, img) {
  fetch('https://vimeo.com/api/oembed.json?width=1920&url=' + encodeURIComponent('https://vimeo.com/' + v.vimeo))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.thumbnail_url) return;
      img.onload = function () { img.classList.add('loaded'); };
      img.src = d.thumbnail_url.replace(/_\d+x\d+/, '_1920');
    })
    .catch(function () {});
}

/* açılış videosu */
var first = VIDEOS[0];
var hero = document.getElementById('hero');
if (first) {
  thumb(first, document.getElementById('heroImg'));
  document.getElementById('heroWatch').textContent = 'İzle — ' + first.title;
  hero.onclick = function () { openPlayer(first.vimeo); };
  hero.onkeydown = function (e) { if (e.key === 'Enter') openPlayer(first.vimeo); };
}

/* işler */
var grid = document.getElementById('grid');
VIDEOS.forEach(function (v) {
  var el = document.createElement('article');
  el.className = 'work reveal';
  el.tabIndex = 0;
  el.innerHTML = '<div class="thumb"><img alt="" loading="lazy"></div><div class="meta"><span class="t"></span><span class="i"></span></div>';
  el.querySelector('.t').textContent = v.title;
  el.querySelector('.i').textContent = v.info || '';
  el.setAttribute('aria-label', v.title + ' izle');
  thumb(v, el.querySelector('img'));
  el.onclick = function () { openPlayer(v.vimeo); };
  el.onkeydown = function (e) { if (e.key === 'Enter') openPlayer(v.vimeo); };
  grid.appendChild(el);
});

/* görünüme girince yumuşakça belirme */
var io = new IntersectionObserver(function (es) {
  es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: .15 });
document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });

/* menü arka planı */
var hdr = document.getElementById('hdr');
function onScroll() { hdr.classList.toggle('solid', scrollY > window.innerHeight * .8); }
addEventListener('scroll', onScroll, { passive: true });
onScroll();

/* oynatıcı */
var player = document.getElementById('player'), pf = document.getElementById('pf');
function openPlayer(vimeo) {
  var parts = vimeo.split('/');
  pf.src = 'https://player.vimeo.com/video/' + parts[0] + '?autoplay=1&title=0&byline=0&portrait=0&dnt=1' + (parts[1] ? '&h=' + parts[1] : '');
  player.classList.add('open'); document.body.style.overflow = 'hidden';
}
function closePlayer() {
  player.classList.remove('open'); document.body.style.overflow = '';
  setTimeout(function () { if (!player.classList.contains('open')) pf.src = ''; }, 400);
}
document.getElementById('close').onclick = closePlayer;
player.addEventListener('click', function (e) { if (e.target === player) closePlayer(); });
addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayer(); });
document.getElementById('yil').textContent = new Date().getFullYear();
</script>
</body>
</html>
