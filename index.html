<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mert Akay — Yönetmen</title>
<meta name="description" content="Mert Akay — Yönetmen. Reklam, müzik videosu ve kısa film.">
<meta property="og:title" content="Mert Akay — Yönetmen">
<meta property="og:description" content="Reklam, müzik videosu ve kısa film.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mertakay.com">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --fs:clamp(9px,.78125vw,16px); --ease:cubic-bezier(.22,.61,.36,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; color:#fff; }
  body { font-family:var(--mono); font-size:var(--fs); text-transform:uppercase; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-transform:inherit; }

  /* açılış ekranı */
  #loader { position:fixed; inset:0; z-index:200; background:#000; display:flex; align-items:center; justify-content:center;
            transition:opacity .8s var(--ease), transform .8s var(--ease); }
  #loader span { font-size:clamp(28px,4vw,56px); letter-spacing:.02em; animation:blink 1.1s steps(2) infinite; }
  #loader.done { opacity:0; transform:scale(1.25); pointer-events:none; }
  @keyframes blink { 50% { opacity:.25; } }

  /* üst menü */
  header { position:fixed; top:24px; left:0; width:100%; z-index:100; mix-blend-mode:difference; user-select:none;
           opacity:0; transition:opacity .8s var(--ease) .3s; }
  body.ready header { opacity:1; }
  header nav { display:flex; justify-content:space-between; padding:0 16px; }

  /* filtreler */
  .filters { padding:calc(24px + 3.2em) 16px 0; display:flex; flex-direction:column; align-items:flex-start; gap:2px; line-height:1.5; }
  .filters button { opacity:.4; transition:opacity .3s; text-align:left; }
  .filters button:hover, .filters button.active { opacity:1; }

  /* ızgara */
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px 16px; padding:10vh 16px 0; }
  .item { position:relative; cursor:pointer; opacity:0; transform:translateY(14px); transition:opacity .7s var(--ease), transform .7s var(--ease); }
  .item.visible { opacity:1; transform:none; }
  .item.hidden { display:none; }
  .item h2 { font-weight:400; font-size:var(--fs); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item h2 .num { margin-right:18px; }
  .media { position:relative; padding-bottom:62.6%; background:#161616; overflow:hidden; }
  .media img, .media video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .media video { opacity:0; transition:opacity .49s; }
  .item:hover .media video.ready { opacity:1; }
  .media img { transition:opacity .49s, filter .49s; }
  .item:hover .media img.vimeo { filter:brightness(1.12); }
  .item.big { grid-column:span 2; grid-row:span 2; }
  .item.big .media { padding-bottom:0; height:calc(100% - var(--fs) * 1.3 - 10px); min-height:30vw; }

  /* alt bilgi */
  .foot { display:flex; justify-content:space-between; padding:16vh 16px 24px; opacity:.4; }
  .foot a:hover { opacity:1; }

  /* bilgi paneli */
  #info { position:fixed; inset:0; z-index:90; background:#000; padding:calc(24px + 5em) 16px 24px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
          opacity:0; visibility:hidden; transition:opacity .5s var(--ease), visibility 0s .5s; overflow:auto; align-content:start; }
  #info.open { opacity:1; visibility:visible; transition:opacity .5s var(--ease); }
  #info .bio { grid-column:2 / span 2; line-height:1.6; }
  #info .bio p + p { margin-top:1.6em; }
  #info .contact { line-height:1.8; }
  #info .contact span { opacity:.4; display:block; }
  #info a:hover { opacity:.6; }

  /* oynatıcı */
  #player { position:fixed; inset:0; z-index:150; background:#000; display:flex; align-items:center; justify-content:center;
            opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility 0s .4s; }
  #player.open { opacity:1; visibility:visible; transition:opacity .4s var(--ease); }
  #player .frame { width:min(100vw - 32px, (100vh - 120px) * 1.7778); aspect-ratio:16/9; }
  #player iframe, #player video { width:100%; height:100%; border:0; display:block; background:#000; }
  #player .frame.file iframe, #player .frame:not(.file) video { display:none; }
  #player .bar { position:absolute; top:24px; left:16px; right:16px; display:flex; justify-content:space-between; }

  @media (max-width:767px) {
    :root { --fs:9px; }
    header nav a:first-child { order:3; } header nav a:last-child { order:2; }
    .grid { grid-template-columns:repeat(2,1fr); gap:16px 8px; padding-top:5vh; }
    .item h2 { margin-bottom:4px; }
    .item h2 .num { margin-right:6px; }
    .item.big .media { height:auto; min-height:0; padding-bottom:62.6%; }
    #info { grid-template-columns:1fr; }
    #info .bio { grid-column:auto; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .item { opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div id="loader"><span>M.A.</span></div>

<header>
  <nav>
    <a href="#" data-act="archive">Arşiv</a>
    <a href="#" data-act="home">M.A.</a>
    <a href="#" data-act="info">Bilgi</a>
  </nav>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span>© <span id="yil"></span> Mert Akay</span><a href="#" data-act="top">Başa dön</a></div>
</main>

<section id="info" aria-hidden="true">
  <div class="contact">
    <span>İletişim</span>
    <a href="mailto:info@mertakay.com" lang="en">info@mertakay.com</a><br>
    <a href="https://vimeo.com/" target="_blank" rel="noopener" lang="en">Vimeo</a><br>
    <a href="https://instagram.com/" target="_blank" rel="noopener" lang="en">Instagram</a>
  </div>
  <div class="bio">
    <p>Mert Akay, İstanbul merkezli bir yönetmen.</p>
    <p>Reklam, müzik videosu ve kısa film alanında markalar ve sanatçılarla çalışıyor.</p>
  </div>
</section>

<div id="player" role="dialog" aria-modal="true" aria-label="Video oynatıcı">
  <div class="bar"><span id="ptitle"></span><button id="close">Kapat</button></div>
  <div class="frame"><iframe id="pf" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe><video id="pv" controls playsinline></video></div>
</div>

<script>
/* ====================================================================
   VİDEOLAR — sırayla ızgaraya dizilir, ilki büyük gösterilir.
   kategori: "reklam", "muzik", "kisa-film" (birden fazlası virgülle)
   secili: true → "Seçilmiş İşler"de görünür
   lang: "en" → İngilizce isimlerde i harfi İ olmasın (ör. Virtualalin)
   Vimeo videosu:   { vimeo: "123456789", title: "...", kategori: "reklam", secili: true }
   Kendi dosyanız:  videolar klasörüne isim.mp4 ve isim.jpg yükleyip
                    { file: "videolar/isim", title: "...", kategori: "reklam", secili: true }
   ==================================================================== */
const VIDEOS = [
  { vimeo: "1070333005", title: "Ayakkabı Dünyası 'Özge Özacar'", kategori: "reklam", secili: true },
  { vimeo: "482504420",  title: "AVVA 'FW21' Murat Boz",          kategori: "reklam", secili: true },
  { vimeo: "1070313913", title: "ELLE x Ford 'Virtualalin'",      kategori: "reklam", secili: true, lang: "en" },
];

const FILTERS = [
  { id: "all",       label: "Tüm Projeler" },
  { id: "secili",    label: "Seçilmiş İşler" },
  { id: "reklam",    label: "Reklam" },
  { id: "muzik",     label: "Müzik Videoları" },
  { id: "kisa-film", label: "Kısa Film" },
];

function vimeoThumb(id, img) {
  fetch('https://vimeo.com/api/oembed.json?width=1280&url=' + encodeURIComponent('https://vimeo.com/' + id))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.thumbnail_url) img.src = d.thumbnail_url.replace(/_\d+x\d+/, '_1280'); })
    .catch(function () {});
}
function inFilter(v, f) {
  if (f === 'all') return true;
  if (f === 'secili') return !!v.secili;
  return (',' + (v.kategori || '') + ',').indexOf(',' + f + ',') > -1;
}

/* ızgara */
var grid = document.getElementById('grid');
var items = VIDEOS.map(function (v, i) {
  var a = document.createElement('article');
  a.className = 'item'; a.tabIndex = 0;
  a.innerHTML = '<h2><span class="num"></span><span class="t"></span></h2><div class="media"><img alt="" loading="lazy"></div>';
  a.querySelector('.t').textContent = v.title;
  if (v.lang) a.querySelector('.t').lang = v.lang;
  a.setAttribute('aria-label', v.title + ' izle');
  var media = a.querySelector('.media'), img = a.querySelector('img');
  if (v.file) {
    img.src = v.file + '.jpg';
    var pv = document.createElement('video');
    pv.muted = true; pv.loop = true; pv.playsInline = true; pv.preload = 'none';
    pv.src = v.file + '.mp4';
    pv.addEventListener('playing', function () { pv.classList.add('ready'); });
    media.appendChild(pv);
    a.addEventListener('mouseenter', function () { var p = pv.play(); if (p && p.catch) p.catch(function () {}); });
    a.addEventListener('mouseleave', function () { pv.pause(); });
  } else {
    img.className = 'vimeo';
    vimeoThumb(v.vimeo.split('/')[0], img);
  }
  a.onclick = function () { openPlayer(v); };
  a.onkeydown = function (e) { if (e.key === 'Enter') openPlayer(v); };
  grid.appendChild(a);
  return { el: a, v: v };
});

/* filtreler (boş kategoriler gösterilmez) */
var filtersEl = document.getElementById('filters');
var current = 'secili';
FILTERS.forEach(function (f) {
  if (f.id !== 'all' && !VIDEOS.some(function (v) { return inFilter(v, f.id); })) return;
  var b = document.createElement('button');
  b.textContent = f.label; b.dataset.f = f.id;
  b.onclick = function () { applyFilter(f.id); };
  filtersEl.appendChild(b);
});
function applyFilter(f) {
  current = f;
  filtersEl.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.f === f); });
  var n = 0;
  items.forEach(function (it) {
    var show = inFilter(it.v, f);
    it.el.classList.toggle('hidden', !show);
    it.el.classList.remove('big', 'visible');
    if (show) {
      n++;
      it.el.querySelector('.num').textContent = String(n).padStart(2, '0');
      if (n === 1) it.el.classList.add('big');
      setTimeout(function () { it.el.classList.add('visible'); }, 60 * n);
    }
  });
}
applyFilter('secili');

/* menü */
var info = document.getElementById('info');
function setInfo(open) { info.classList.toggle('open', open); info.setAttribute('aria-hidden', !open); }
document.querySelectorAll('[data-act]').forEach(function (a) {
  a.onclick = function (e) {
    e.preventDefault();
    var act = a.dataset.act;
    if (act === 'info') { setInfo(!info.classList.contains('open')); return; }
    setInfo(false);
    if (act === 'archive') applyFilter('all');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});

/* oynatıcı */
var player = document.getElementById('player'), pf = document.getElementById('pf'), pvid = document.getElementById('pv');
var frame = player.querySelector('.frame');
function openPlayer(v) {
  var pt = document.getElementById('ptitle'); pt.textContent = v.title; pt.lang = v.lang || 'tr';
  if (v.file) {
    frame.classList.add('file');
    pvid.poster = v.file + '.jpg'; pvid.src = v.file + '.mp4';
    var p = pvid.play(); if (p && p.catch) p.catch(function () {});
  } else {
    frame.classList.remove('file');
    var parts = v.vimeo.split('/');
    pf.src = 'https://player.vimeo.com/video/' + parts[0] + '?autoplay=1&title=0&byline=0&portrait=0&dnt=1' + (parts[1] ? '&h=' + parts[1] : '');
  }
  player.classList.add('open'); document.body.style.overflow = 'hidden';
}
function closePlayer() {
  player.classList.remove('open'); document.body.style.overflow = '';
  pvid.pause();
  setTimeout(function () { if (!player.classList.contains('open')) { pf.src = ''; pvid.removeAttribute('src'); pvid.load(); } }, 400);
}
document.getElementById('close').onclick = closePlayer;
addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePlayer(); setInfo(false); } });

/* açılış */
document.getElementById('yil').textContent = new Date().getFullYear();
window.addEventListener('load', function () {
  setTimeout(function () { document.getElementById('loader').classList.add('done'); document.body.classList.add('ready'); }, 700);
});
</script>
</body>
</html>
